name: Validate Plugin Structure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check plugin manifest exists
        run: test -f .claude-plugin/plugin.json

      - name: Validate plugin manifest JSON
        run: python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"

      - name: Check marketplace manifest exists
        run: test -f .claude-plugin/marketplace.json

      - name: Validate marketplace manifest JSON
        run: python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Check each skill has SKILL.md
        run: |
          for dir in skills/*/; do
            skill=$(basename "$dir")
            if [ ! -f "$dir/SKILL.md" ]; then
              echo "MISSING: $dir/SKILL.md"
              exit 1
            fi
            echo "OK: $skill"
          done

      - name: Check SKILL.md files have frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            if ! head -1 "$f" | grep -q "^---$"; then
              echo "MISSING frontmatter: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Check generated agent definitions are up to date
        run: |
          # generated/agents/** is derived from agents/*.md by scripts/sync-agents.sh.
          # A stale copy ships wrong tool names, and a harness given foreign tool
          # names grants NO tools and returns an empty review with exit 0 -- which
          # synthesises into a false "no findings". Drift must break the build.
          ./scripts/sync-agents.sh --check
